#        org.springframework.web: DEBUG
#        org.springframework.cloud.gateway: DEBUG

baseUrl: http://localhost:8080

spring:
  application:
    name: ApiGateway
  profiles:
    active: dev
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/file-management
        registration:
          gateway-client:
            provider: keycloak
            client-id: gateway-client
            client-secret: UDeZXlu98uuR15s27yHyGyWOvNj7h2VU
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - roles
  cloud:
    gateway:
      mvc:
        # The AI-job / RAG live channel is STOMP-over-SockJS. Since the servlet gateway can't
        # proxy a raw WebSocket upgrade, SockJS falls back to HTTP *streaming* transports whose
        # response never completes (eventsource, xhr_streaming). By default Spring Cloud Gateway
        # MVC buffers every proxied response to EOF (streaming-media-types is empty), so the
        # receive channel delivers no bytes, the browser's EventSource/xhr_streaming aborts on
        # the SockJS transport timeout, and STOMP never connects — no live updates anywhere.
        # Listing these content types switches them to incremental, flushing copy.
        # Match is exact (List.contains -> MediaType.equals), so the charset MUST be included.
        streaming-media-types:
          - "text/event-stream;charset=UTF-8"
          - "application/javascript;charset=UTF-8"
        routes:
          - id: file-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/files/**, /api/v1/uploads/** , /api/v1/outbox/**
            filters:
              - TokenRelay

          - id: user-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/users/**
            filters:
              - TokenRelay

          - id: ai-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/jobs/**
            filters:
              - TokenRelay

          - id: ai-rag-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/rag/**
            filters:
              - TokenRelay

          - id: ui
            uri: ${UI_URL}
            predicates:
              - Path=/ui,/ui/**
            filters:
              - AddRequestHeader=X-Debug, true

# use the production url, not the development one
UI_URL: "http://localhost:5173"

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
  metrics:
    distribution:
      # Emit histogram buckets so Grafana can compute real p95/p99 + heatmaps.
      percentiles-histogram:
        http.server.requests: true

