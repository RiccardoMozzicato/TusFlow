services:
  postgres:
    image: postgres:15
    container_name: fileServiceDB
    environment:
      POSTGRES_DB: filedb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    labels:
      org.springframework.boot.ignore: true
    networks:
      - kfk-net

  postgres_aireq:
    image: pgvector/pgvector:pg15
    container_name: aiserviceDB
    environment:
      POSTGRES_DB: aireqdb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"
    volumes:
      - pg_ai:/var/lib/postgresql/ai
    labels:
      org.springframework.boot.ignore: true
    networks:
      - kfk-net

  postgres_user:
    image: postgres:15
    container_name: userDetailService
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pg_user:/var/lib/postgresql/user
    labels:
      org.springframework.boot.ignore: true

  minio:
    image: quay.io/minio/minio:latest
    container_name: fileServiceMinio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PORT: 5432
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      #KC_BOOTSTRAP_ADMIN_USERNAME: admin
      #KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command:
      - start-dev
      - --import-realm
      - --log-level=DEBUG
      - --verbose
    volumes:
      - ./keycloak/:/opt/keycloak/data/import
    depends_on:
      - postgres_keycloak

  postgres_keycloak:
    image: postgres:15
    ports:
      - "5434:5432"
    container_name: keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pg_key:/var/lib/postgresql/data
    labels:
      org.springframework.boot.ignore: true

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka_broker
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - kfk-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui2
    depends_on:
      - kafka
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - kfk-net

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "3100:3100"   # Loki (log ingestion)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9099:9090"   # Prometheus
    volumes:
      - lgtm_data:/data
    networks:
      - kfk-net

networks:
  kfk-net:
    driver: bridge

volumes:
  pg_data:
  pg_key:
  pg_ai:
  pg_user:
  minio_data:
  kafka_data:
  lgtm_data:
