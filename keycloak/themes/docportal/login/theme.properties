# DocPortal login theme — extends the stock keycloak.v2 (PatternFly v5) theme
# and layers the "Corporate Precision" brand on top. The OIDC flow is unchanged;
# only the look of the login page differs.
parent=keycloak.v2
import=common/keycloak

# Keep the parent's styles.css (resolved up the parent chain) and append ours.
styles=css/styles.css css/docportal.css
