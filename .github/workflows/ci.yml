name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - AIProcessingService
          - ApiGateway
          - TusUploaderService
          - UserDetailService

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew

      - name: Build
        working-directory: ${{ matrix.service }}
        run: ./gradlew build -x test

      - name: Test
        working-directory: ${{ matrix.service }}
        run: ./gradlew test
        continue-on-error: true  # ← key fix

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "${{ matrix.service }}/build/test-results/**/*.xml"
          check_name: "Test Results (${{ matrix.service }})"
          fail_on_failure: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/