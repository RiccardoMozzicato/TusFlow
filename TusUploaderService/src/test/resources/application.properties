spring.application.name=TusUploaderService
spring.mvc.problemdetails.enabled=true

springdoc.default-response-status=false
springdoc.remove-broken-reference-definitions=true
springdoc.override-with-generic-response=false
springdoc.show-actuator=false


tus.version=1.0.0
tus.extensions=creation,creation-defer-length,creation-with-upload,expiration,checksum,termination
tus.maxSize=1073741824
tus.checksumAlgorithm=sha-1
tus.vary=access-control-request-headers
tus.allowMethods=OPTIONS,POST,HEAD,PATCH,DELETE
tus.allowHeaders=*
tus.exposeHeaders=location,upload-offset,upload-length,upload-expires,tus-version,tus-extension,tus-resumable,tus-checksum-algorithm,upload-metadata
tus.allowOrigin=*
tus.expirationPeriod=3600

# Logging configuration
logging.level.root=INFO
logging.level.g11.tusuploaderservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Test Database Configuration - PostgreSQL with Testcontainers
# Database URL, username, and password will be set by Testcontainers
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (optional, useful for debugging)
spring.h2.console.enabled=false

# Disable Docker Compose for tests
spring.docker.compose.enabled=false

# Flyway configuration for tests
spring.flyway.enabled=true

# MinIO configuration for tests (using dummy values)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.uploads-bucket=uploads
minio.files-bucket=files

# Kafka configuration for tests - will be overridden by @EmbeddedKafka
kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=test-group-tus
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# Keycloak configuration for tests (dummy values)
issuer=http://localhost:9090/realms/file-management
keycloak.client-id=tus-client
keycloak.client-secret=test-secret
keycloak.token-uri=http://localhost:9090/realms/file-management/protocol/openid-connect/token
