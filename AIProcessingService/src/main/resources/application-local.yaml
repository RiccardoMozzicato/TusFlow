# Local profile: route AI chat to a self-hosted OpenWebUI instance.
#
# OpenWebUI exposes an OpenAI-compatible API, so we reuse Spring AI's existing
# `openai` provider and just override the endpoint, key, model, and the
# completions path (OpenWebUI serves it at /api/chat/completions, not /v1/...).
#
# Activate with:  --spring.profiles.active=local
# (or env var SPRING_PROFILES_ACTIVE=local)
#
# Required env vars:
#   OPENWEBUI_BASE_URL   e.g. http://localhost:3000   (no trailing slash)
#   OPENWEBUI_API_KEY    Bearer key from OpenWebUI > Settings > Account > API Keys
#   OPENWEBUI_MODEL      model id as listed in OpenWebUI (e.g. llama3.1)

spring:
  ai:
    openai:
      api-key: ${OPENWEBUI_API_KEY}
      base-url: ${OPENWEBUI_BASE_URL:https://openwebui.nicolfo.it/api/}
      chat:
        # OpenWebUI's OpenAI-compatible chat endpoint lives under /api, not /v1
        completions-path: /chat/completions
        options:
          model: ${OPENWEBUI_MODEL:Qwen/Qwen3.5-122B-A10B-FP8}
      embedding:
        # base-url already ends in /api, so the endpoint resolves to /api/embeddings
        embeddings-path: /embeddings
        options:
          # Native 2560-dim output (no MRL truncation) to match the migrated store.
          model: ${OPENWEBUI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}


ai:
  # The self-hosted reasoning model thinks for tens of seconds before answering,
  # which blows past AiConfig's 20s default. Give it generous headroom.
  openai:
    read-timeout-ms: 300000   # 5 min
    connect-timeout-ms: 10000 # 10 s
  chat:
    model: ${OPENWEBUI_MODEL:Qwen/Qwen3.5-122B-A10B-FP8}
  pdf:
    model: ${OPENWEBUI_MODEL:Qwen/Qwen3.5-122B-A10B-FP8}
  # Image analysis intentionally stays on Groq: imageChatClient uses its own endpoint from
  # ai.image.base-url / ai.image.api-key (defined in application.yml, defaulting to GROQ_*).
  # We deliberately do NOT override those here, so vision keeps hitting Groq's Llama 4 Scout
  # even though chat/pdf above are repointed at the self-hosted OpenWebUI model.
  image:
    model: ${IMAGE_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
  document:
    # Cap document content at 128K *characters* before sending to the model. Note this is a
    # character cap, not a token cap: truncateContent slices the raw string, while the model's
    # limit is 131072 *tokens*. 128K chars ~= 30-45K tokens, which leaves ample headroom for the
    # analysis prompt template and prevents the "maximum context length 131072 tokens" 400 errors
    # that occurred with truncation disabled (was 0). Raise toward ~400000 to use more of the
    # window, but leave margin — token density varies and overflow returns near the limit.
    max-content-chars: 131072

# Send RAG eval scores to the self-hosted Langfuse (docker-compose). Pinned here (not via
# env) so the local profile works without IDE/.env env-var loading. Uses the auto-provisioned
# local-dev key pair (docker-compose LANGFUSE_INIT_*). Override via env in other environments.
app:
  rag:
    scoring:
      langfuse-base-url: http://localhost:3001
      langfuse-auth-header: "Basic cGstbGYtbG9jYWwtZGV2OnNrLWxmLWxvY2FsLWRldg=="

# Export OpenTelemetry traces to the self-hosted Langfuse OTLP endpoint. Hardcoded for the
# local profile so it does not depend on LANGFUSE_OTLP_ENDPOINT / LANGFUSE_AUTH_HEADER being
# present in the run environment (the base application.yml still uses those env vars, defaulting
# to the local LGTM stack on :4318). x-langfuse-ingestion-version carries over from the base.
management:
  otlp:
    tracing:
      endpoint: http://localhost:3001/api/public/otel/v1/traces
      headers:
        Authorization: "Basic cGstbGYtbG9jYWwtZGV2OnNrLWxmLWxvY2FsLWRldg=="
        x-langfuse-ingestion-version: "4"
