server:
    port: 8083

issuer: http://localhost:9090/realms/file-management

management:
  tracing:
    sampling:
      probability: 1.0
    baggage:
      # Propagate the Langfuse trace-level ids to EVERY span in a trace (not just the root),
      # so per-observation filtering by user/session is reliable in Langfuse. RagTracing sets
      # these as baggage around the query; tag-fields copies them onto each child span, and
      # remote-fields also carries them across services via the W3C `baggage` header.
      # Field names must equal the Langfuse attribute keys.
      remote-fields:
        - langfuse.user.id
        - langfuse.session.id
      tag-fields:
        - langfuse.user.id
        - langfuse.session.id
  otlp:
    tracing:
      # Set LANGFUSE_OTLP_ENDPOINT=https://cloud.langfuse.com/api/public/otel/v1/traces
      # (or https://us.cloud.langfuse.com/api/public/otel/v1/traces for US region)
      # to send traces to Langfuse. Defaults to local LGTM stack.
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        # Set LANGFUSE_AUTH_HEADER="Basic <base64(publicKey:secretKey)>" for Langfuse auth.
        # Leave unset (or empty) when using the local LGTM stack.
        Authorization: ${LANGFUSE_AUTH_HEADER:}
        x-langfuse-ingestion-version: "4"
    metrics:
      export:
        # Metrics always ship to the local LGTM Prometheus, never Langfuse.
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
  metrics:
    distribution:
      # Emit histogram buckets so Grafana can compute real p95/p99 + heatmaps.
      percentiles-histogram:
        http.server.requests: true

otel:
  instrumentation:
    spring-webmvc:
      enabled: false # Suppress duplicate OTel HTTP server spans
    spring-web:
      enabled: false # Suppress duplicate OTel HTTP client spans