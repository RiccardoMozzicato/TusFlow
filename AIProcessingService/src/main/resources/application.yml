spring:
  application:
    name: AIProcessingService
  reactor:
    # Bridge thread-local trace/baggage context into Reactor so the streaming RAG path
    # (RagService.streamQuery) keeps one trace and carries langfuse.user.id / session onto
    # the Spring AI ChatModel generation span. Without this, streamed chats produce a
    # fragmented, user-less trace in Langfuse.
    context-propagation: auto
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5435/aireqdb
    username: myuser
    password: secret
  ai:
    chat:
      observations:
        # Prompt/completion CONTENT is surfaced onto generation spans by
        # tracing/LangfuseObservationFilter (gen_ai.prompt / gen_ai.completion) — it reads
        # the observation context directly, so it works regardless of the flags below.
        # Spring AI 1.1.x renamed the content flags to log-prompt/log-completion (the old
        # include-prompt/include-completion were silently ignored); enabling them is
        # redundant with the filter and logs a startup security warning, so we leave them off
        # and only enable error capture for failed generations.
        include-error-logging: true
      memory:
        repository:
          jdbc:
            # Schema owned by Flyway (V11__create_chat_memory.sql), not the framework.
            initialize-schema: never
    retry:
      max-attempts: 1
      on-client-errors: false
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 2560  # Qwen3-Embedding-4B native dimensionality
        initialize-schema: false  # Gestito da Flyway migrations
        table-name: vector_store
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL:qwen/qwen3.6-27b}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          # Qwen3-Embedding 4B → 2560 dims (must match pgvector dimensions + the
          # vector_store column). Use the :4b tag; :0.6b is 1024 and :8b is 4096.
          model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
    user:
      name: user
      password: password


# AI Document Processing Configuration
ai:
  retry:
    # Internal exponential-backoff attempts on the FIRST upload analysis. A retry (Kafka redelivery
    # or a user retry) runs a single immediate attempt instead — see MetadataProcessor.
    max-automatic-retries: 3
    # Manual retries the user may trigger after the automatic phase is exhausted.
    max-user-retries: 4
    # Kafka @RetryableTopic: 2 deliveries (original + 1 redelivery), with no backoff between them.
    kafka-attempts: 2
    kafka-delay-ms: 30000
    simulate-llm-offline: false

  # Model for general chat (default AI interactions)
  chat:
    model: ${CHAT_MODEL:qwen/qwen3.6-27b}
  # Model for PDF analysis (using a more powerful Groq model)
  # Llama 3.3 70B is the current powerful model for complex document analysis
  pdf:
    model: ${PDF_MODEL:qwen/qwen3.6-27b}
  # Model for image analysis (must be a vision-capable model)
  # Llama 4 Scout supports image input via Groq's OpenAI-compatible API
  image:
    model: ${IMAGE_MODEL:qwen/qwen3.6-27b}
    # Vision analysis always targets Groq, independent of spring.ai.openai.* — so it keeps
    # working when a profile (e.g. `local`) points chat/pdf at a non-vision self-hosted model.
    base-url: ${IMAGE_BASE_URL:${GROQ_BASE_URL}}
    api-key: ${IMAGE_API_KEY:${GROQ_API_KEY}}
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

  document:
    # Maximum characters to send to AI (to avoid token limits)
    # Approximate token calculation: chars / 4 = tokens
    # Default: 15000 chars ≈ 3750 tokens (safe for most models)
    max-content-chars: 15000

    # Truncation strategy: "beginning", "end", "beginning-end", "smart"
    truncation-strategy: "beginning-end"

    # When using "beginning-end", percentage to take from beginning
    beginning-percentage: 70

  analysis:
    # Content types accepted for AI analysis. Anything else is marked UNSUPPORTED:
    # the file is still stored and downloadable, it just isn't analyzed.
    supported-content-types:
      prefixes:        # MIME family prefixes
        - text/
        - image/
      types:           # exact MIME types (base type, charset ignored)
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/json
        - application/xml
        - application/xhtml+xml
        - application/yaml
        - application/x-yaml
        - application/csv

# Embedding metadata stored alongside each vector (informational) + the local-profile
# provider toggle read by EmbeddingConfig. Keep these in sync with the active model:
# Qwen3-Embedding-4B → 2560 dims (both the Ollama and OpenWebUI backends).
app:
  embedding:
    model: ${EMBEDDING_MODEL_NAME:qwen3-embedding-4b}
    dimensions: ${EMBEDDING_DIMENSIONS:2560}
    # local profile only: 'ollama' (default) or 'openai'/'openwebui'.
    provider: ${APP_EMBEDDING_PROVIDER:openwebui}
    # Kafka consumer threads embedding batches in parallel — each thread = 1 concurrent
    # call to the model backend. Capped by the partition count of `embeddings-batch`.
    # Lower to 1-2 when running a single self-hosted GPU (e.g. the 4B model on a Mac).
    concurrency: ${EMBEDDING_CONCURRENCY:3}

  # Retrieval-Augmented Generation. The model retrieves on demand via the content-search tool
  # (DocumentSearchService); top-k/similarity-threshold tune that search.
  # similarity-threshold is 0.0 (off) by default so retrieval doesn't regress before the score
  # distribution of the active embedding model is known; raise it (e.g. 0.5) once Langfuse traces
  # show typical similarity scores.
  rag:
    retrieval:
      top-k: ${RAG_TOP_K:5}
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}
    memory:
      # Conversation window kept per chat; older turns drop off.
      max-messages: ${RAG_MEMORY_MAX_MESSAGES:20}
    streaming:
      # POST /api/rag/query/stream pushes the answer over STOMP (/user/queue/rag).
      enabled: ${RAG_STREAMING_ENABLED:true}
    scoring:
      # Langfuse evaluation scores on RAG query traces (off by default; all best-effort/async).
      # relevance is cheap (mean source similarity); groundedness adds one LLM-judge call per query.
      # Reuses the OTLP Basic auth header; base-url is the Langfuse host (no /api path).
      enabled: ${RAG_SCORING_ENABLED:true}
      relevance: ${RAG_SCORING_RELEVANCE:true}
      groundedness: ${RAG_SCORING_GROUNDEDNESS:true}
      langfuse-base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
      langfuse-auth-header: ${LANGFUSE_AUTH_HEADER:}

keycloak:
  client-id: ai-client
  client-secret: f9n2EePzamfcR3gieGYidhBjNjY3Jxr9
  token-uri: http://localhost:9090/realms/file-management/protocol/openid-connect/token

kafka:
  bootstrap-servers: "localhost:9094"
  consumer:
    auto-offset-reset: latest  # Solo nuovi messaggi dopo il primo avvio
    group-id: "ai-processing-service-group"
    enable-auto-commit: false  # ✅ Disabilita auto-commit, usiamo ACK manuale
  producer:
    bootstrap-servers: "localhost:9094"
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    # Silence PDFBox/FontBox per-glyph noise on PDFs with subsetted math fonts (e.g. CambriaMath):
    # "No Unicode mapping for ..." / "Format 14 cmap table is not supported". Harmless during text
    # extraction — those math glyphs just aren't mapped. ERROR still surfaces real parse failures.
    org.apache.pdfbox: ERROR
    org.apache.fontbox: ERROR
