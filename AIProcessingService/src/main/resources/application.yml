spring:
  application:
    name: AIProcessingService
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5435/aireqdb
    username: myuser
    password: secret
  ai:
    chat:
      observations:
        include-prompt: true
        include-completion: true
    retry:
      max-attempts: 1
      on-client-errors: false
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 768  # nomic-embed-text usa 768 dimensioni (non 1536)
        initialize-schema: false  # Gestito da Flyway migrations
        table-name: vector_store
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
    user:
      name: user
      password: password


# AI Document Processing Configuration
ai:
  retry:
    # Internal exponential-backoff attempts on the FIRST upload analysis. A retry (Kafka redelivery
    # or a user retry) runs a single immediate attempt instead — see MetadataProcessor.
    max-automatic-retries: 3
    # Manual retries the user may trigger after the automatic phase is exhausted.
    max-user-retries: 4
    # Kafka @RetryableTopic: 2 deliveries (original + 1 redelivery), with no backoff between them.
    kafka-attempts: 2
    kafka-delay-ms: 30000
    simulate-llm-offline: false

  # Model for general chat (default AI interactions)
  chat:
    model: ${CHAT_MODEL:llama-3.1-8b-instant}
  # Model for PDF analysis (using a more powerful Groq model)
  # Llama 3.3 70B is the current powerful model for complex document analysis
  pdf:
    model: ${PDF_MODEL:llama-3.3-70b-versatile}
  # Model for image analysis (must be a vision-capable model)
  # Llama 4 Scout supports image input via Groq's OpenAI-compatible API
  image:
    model: ${IMAGE_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
    # Vision analysis always targets Groq, independent of spring.ai.openai.* — so it keeps
    # working when a profile (e.g. `local`) points chat/pdf at a non-vision self-hosted model.
    base-url: ${IMAGE_BASE_URL:${GROQ_BASE_URL}}
    api-key: ${IMAGE_API_KEY:${GROQ_API_KEY}}
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

  document:
    # Maximum characters to send to AI (to avoid token limits)
    # Approximate token calculation: chars / 4 = tokens
    # Default: 15000 chars ≈ 3750 tokens (safe for most models)
    max-content-chars: 15000

    # Truncation strategy: "beginning", "end", "beginning-end", "smart"
    truncation-strategy: "beginning-end"

    # When using "beginning-end", percentage to take from beginning
    beginning-percentage: 70

  analysis:
    # Content types accepted for AI analysis. Anything else is marked UNSUPPORTED:
    # the file is still stored and downloadable, it just isn't analyzed.
    supported-content-types:
      prefixes:        # MIME family prefixes
        - text/
        - image/
      types:           # exact MIME types (base type, charset ignored)
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/json
        - application/xml
        - application/xhtml+xml
        - application/yaml
        - application/x-yaml
        - application/csv

keycloak:
  client-id: ai-client
  client-secret: f9n2EePzamfcR3gieGYidhBjNjY3Jxr9
  token-uri: http://localhost:9090/realms/file-management/protocol/openid-connect/token

kafka:
  bootstrap-servers: "localhost:9094"
  consumer:
    auto-offset-reset: latest  # Solo nuovi messaggi dopo il primo avvio
    group-id: "ai-processing-service-group"
    enable-auto-commit: false  # ✅ Disabilita auto-commit, usiamo ACK manuale
  producer:
    bootstrap-servers: "localhost:9094"
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

#logging:
#  level:
#    g11:
#      aiprocessingservice: INFO
#    org:
#      springframework:
#        ai:
#          chat:
#            client:
#              advisor: DEBUG
server:
    port: 8083

issuer: http://localhost:9090/realms/file-management

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Set LANGFUSE_OTLP_ENDPOINT=https://cloud.langfuse.com/api/public/otel/v1/traces
      # (or https://us.cloud.langfuse.com/api/public/otel/v1/traces for US region)
      # to send traces to Langfuse. Defaults to local LGTM stack.
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        # Set LANGFUSE_AUTH_HEADER="Basic <base64(publicKey:secretKey)>" for Langfuse auth.
        # Leave unset (or empty) when using the local LGTM stack.
        Authorization: ${LANGFUSE_AUTH_HEADER:}
        x-langfuse-ingestion-version: "4"

otel:
  instrumentation:
    spring-webmvc:
      enabled: false # Suppress duplicate OTel HTTP server spans
    spring-web:
      enabled: false # Suppress duplicate OTel HTTP client spans