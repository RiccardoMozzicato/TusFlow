spring:
    application:
      name: UserDetailService
    profiles:
      active: dev
    datasource:
      url: jdbc:postgresql://localhost:5433/userdb
      username: myuser
      password: secret
    jpa:
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
      hibernate:
        ddl-auto: none
    flyway:
      enabled: true
      target: latest
      locations: classpath:db/migration
    mvc:
      problemdetails:
        enabled: true
    security:
      oauth2:
        client:
          provider:
            keycloak:
              issuer-uri: http://localhost:9090/realms/file-management
        resourceserver:
          jwt:
            issuer-uri: http://localhost:9090/realms/file-management
server:
  port: 8082

#logging:
#    level:
#      org.springframework.web: DEBUG
#      org.springframework.security: DEBUG

keycloak-admin:
  server-url: http://localhost:9090/
  realm: file-management
  client-id: user-admin
  secret: lgwvWQ7TnGvcRL1SYxsdzUu7j3hiXDNB

kafka:
  bootstrap-servers: localhost:9094
  consumer:
    group-id: userdetail-service

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
  metrics:
    distribution:
      # Emit histogram buckets so Grafana can compute real p95/p99 + heatmaps.
      percentiles-histogram:
        http.server.requests: true

